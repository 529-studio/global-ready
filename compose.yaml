name: global-ready

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-global_ready}
      POSTGRES_USER: ${POSTGRES_USER:-global_ready}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-global_ready}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - global-ready-postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-global_ready} -d ${POSTGRES_DB:-global_ready}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-global_ready}
      DATABASE_USER: ${POSTGRES_USER:-global_ready}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-global_ready}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  global-ready-postgres:
