version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      gradle-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      npm-non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns:
          - "*"
